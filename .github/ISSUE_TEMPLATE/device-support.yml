name: 设备兼容性反馈
description: 报告设备支持情况或申请新型号适配
body:
  - type: markdown
    attributes:
      value: 请勿填写 MAC 地址、序列号、设备实例路径或个人账号。设备别名也可能包含个人信息。
  - type: input
    id: model
    attributes:
      label: 品牌和完整型号
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: 连接方式
      options:
        - 蓝牙 BLE
        - 蓝牙（不确定是否 BLE）
        - 2.4G USB 接收器
        - 有线 USB
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本与程序版本
  - type: textarea
    id: result
    attributes:
      label: 当前结果与期望结果
      description: Windows 设置是否显示电量？本程序显示哪个数据来源、百分比或错误？请同时说明是否与官方软件对照。
    validations:
      required: true
